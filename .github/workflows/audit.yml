# Dependency audit (0.17): the npm advisories for the package and the website. It also runs each
# Monday, so a new advisory shows up without a push. The shipped dependencies fail on any
# advisory, the build tools on high ones. An exception needs a reason in docs/security-deps.md.
name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 (version from packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          check-latest: true
      - name: Node has the latest security fixes
        run: node scripts/check-node.mjs
      - name: Shipped dependencies (any advisory)
        run: pnpm audit --prod --audit-level=low
      - name: All dependencies (high and critical)
        run: pnpm audit --audit-level=high
      - name: Website (high and critical)
        working-directory: site
        run: pnpm audit --audit-level=high
