# Dependency audit (0.17): the npm advisories for the package and the website. It also runs each
# Monday, so a new advisory shows up without a push. The shipped dependencies fail on any
# advisory, the build tools on high ones. An exception needs a reason in docs/security-deps.md.
name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
      - name: Node has the latest security fixes
        run: node scripts/check-node.mjs
      - name: Shipped dependencies (any advisory)
        run: pnpm audit --prod --audit-level=low
      - name: All dependencies (high and critical)
        run: pnpm audit --audit-level=high
      - name: Website (high and critical)
        working-directory: site
        run: pnpm audit --audit-level=high
