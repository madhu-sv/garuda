# Dependabot (0.17): weekly update pull requests for npm (package and website) and for the pinned
# GitHub Actions. Security updates come at once when "Dependabot security updates" is on in the
# repository settings. Each pull request runs CI and the audit like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Majors come one pull request each (not in the group), so each gets its own live check.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The types must match the oldest Node that Garuda supports (22), or code could use an API
      # that Node 22 lacks and tsc would not see it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
